<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE-AKAS | Full Menu</title>
    
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="menu.css"> 
</head>
<body>

    <div class="full-menu-page-container">
        <a href="index.html" class="back-link">← BACK</a>
        
    <div class="header">
        <div class="logo-wrapper">
            <img src="assets/images/cafeakas.png" alt="Logo" class="menu-logo">
            <h1 class="brand-name">CAFE-AKAS</h1>
        </div>
        <p class="sub-brand">ម៉ឺនុយភេសជ្ជៈ | Drink Menu</p>
    </div>

        <h3 class="category-title">កាហ្វេ (Coffee)</h3>
        <div class="menu-items-grid">
            <div class="item-card">
                <div class="image-wrapper">
                    <img src="assets/images/Iced-Latte.webp" alt="Iced Latte"> </div>
                <div class="item-details">
                    <span class="item-name">Iced Latte</span> 
                    <span class="item-price">5000៛</span>
                </div>
            </div>

            <div class="item-card">
                <div class="image-wrapper">
                    <img src="assets/images/Iced_Americano.jpg" alt="Iced Americano"> </div>
                <div class="item-details">
                    <span class="item-name">Iced Americano</span> 
                    <span class="item-price">5000៛</span>
                </div>
            </div>

            <div class="item-card">
                <div class="image-wrapper">
                    <img src="assets/images/Iced-Cappuccino.png" alt="Iced Cappuccino"> </div>
                <div class="item-details">
                    <span class="item-name">Iced Cappuccino</span> 
                    <span class="item-price">6000៛</span>
                </div>
            </div>
            
             <div class="item-card">
                <div class="image-wrapper">
                    <img src="assets/images/mocha.jpg" alt="Iced Mocha"> </div>
                <div class="item-details">
                    <span class="item-name">Iced Mocha</span> 
                    <span class="item-price">6000៛</span>
                </div>
            </div>

        </div>

        <h3 class="category-title">តែ & ម៉ាត់ឆា (Tea & Matcha)</h3>
        <div class="menu-items-grid">
            <div class="item-card">
                <div class="image-wrapper">
                    <img src="assets/images/tea.jpg" alt="Iced Green Tea"> </div>
                <div class="item-details">
                    <span class="item-name">Iced Green Tea</span> 
                    <span class="item-price">4000៛</span>
                </div>
            </div>

            <div class="item-card">
                <div class="image-wrapper">
                    <img src="assets/images/matcha.jpg" alt="Matcha Latte"> </div>
                <div class="item-details">
                    <span class="item-name">Matcha Latte</span> 
                    <span class="item-price">6000៛</span>
                </div>
            </div>

            <div class="item-card">
                <div class="image-wrapper">
                    <img src="assets/images/lemontea.jpg" alt="Lemon Tea"> </div>
                <div class="item-details">
                    <span class="item-name">Lemon Tea</span> 
                    <span class="item-price">4500៛</span>
                </div>
            </div>
        </div>

        <footer class="signature-footer">
            <div class="sig-container">
                <span class="sig-item">CAFE-AKAS</span>
                <span class="sig-divider"></span>
                <span class="sig-item">EST. 2026</span>
                <span class="sig-divider"></span>
                <span class="sig-item">PHNOM PENH</span>
            </div>
            <p class="sig-khmer">គុណភាព និង ក្ដីស្រឡាញ់</p>
        </footer>
    </div>

</body>
</html>
